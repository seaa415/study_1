<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>드라마 공모전 스터디</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", "Segoe UI", Roboto, sans-serif; }
  </style>
</head>
<body class="bg-[#F9FBF9] text-[#2D3748] antialiased min-h-screen">

  <!-- Header -->
  <header class="bg-white border-b border-gray-200 sticky top-0 z-20 shadow-sm">
    <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-lg bg-[#1E3A2F] flex items-center justify-center text-white">
          <i data-lucide="file-text" class="w-4 h-4"></i>
        </div>
        <span class="font-bold text-lg text-[#1E3A2F] tracking-tight">SCENARIO STUDY LAB</span>
      </div>

      <div class="flex items-center gap-2">
        <button id="btn-tab-projects" onclick="switchTab('projects')" class="px-4 py-2 rounded-lg text-sm font-medium transition-all bg-[#E8F0EC] text-[#1E3A2F]">
          대본 집필 현황
        </button>
        <button id="btn-tab-archive" onclick="switchTab('archive')" class="px-4 py-2 rounded-lg text-sm font-medium transition-all text-gray-500 hover:bg-gray-100">
          작품 분석 & 자료실
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-7xl mx-auto px-6 py-8">
    
    <!-- TAB 1: 대본 집필 현황 -->
    <section id="section-projects" class="space-y-6">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 bg-white p-5 rounded-2xl border border-gray-100 shadow-sm">
        <div class="flex items-center gap-2 overflow-x-auto pb-1 sm:pb-0" id="member-filter-group">
          <span class="text-xs font-semibold text-gray-400 mr-2 flex items-center gap-1">
            <i data-lucide="users" class="w-3.5 h-3.5"></i> 멤버별 보기
          </span>
          <button onclick="filterMember('전체')" class="mem-btn px-3 py-1.5 rounded-full text-xs font-medium bg-[#1E3A2F] text-white" data-member="전체">전체</button>
          <button onclick="filterMember('세아')" class="mem-btn px-3 py-1.5 rounded-full text-xs font-medium bg-gray-100 text-gray-600 hover:bg-gray-200" data-member="세아">세아</button>
          <button onclick="filterMember('멤버A')" class="mem-btn px-3 py-1.5 rounded-full text-xs font-medium bg-gray-100 text-gray-600 hover:bg-gray-200" data-member="멤버A">멤버A</button>
          <button onclick="filterMember('멤버B')" class="mem-btn px-3 py-1.5 rounded-full text-xs font-medium bg-gray-100 text-gray-600 hover:bg-gray-200" data-member="멤버B">멤버B</button>
        </div>
      </div>

      <!-- Projects Table -->
      <div class="bg-white rounded-2xl border border-gray-100 shadow-sm overflow-hidden">
        <div class="overflow-x-auto">
          <table class="w-full text-left text-sm">
            <thead class="bg-[#FAFBF9] border-b border-gray-100 text-xs font-semibold text-gray-500 uppercase">
              <tr>
                <th class="py-4 px-6">작가</th>
                <th class="py-4 px-6">작품명 / 장르</th>
                <th class="py-4 px-6">목표 공모전</th>
                <th class="py-4 px-6 w-44">완성률</th>
                <th class="py-4 px-6">현재 진행 단계</th>
                <th class="py-4 px-6">피드백 참여자</th>
                <th class="py-4 px-6 text-center">구글 문서</th>
              </tr>
            </thead>
            <tbody id="projects-table-body" class="divide-y divide-gray-100">
              <!-- JS로 렌더링 -->
            </tbody>
          </table>
        </div>
      </div>
    </section>

    <!-- TAB 2: 작품 분석 & 이론서 자료실 -->
    <section id="section-archive" class="space-y-6 hidden">
      <div>
        <h2 class="text-lg font-bold text-[#1E3A2F]">작품 분석 및 작법 자료</h2>
        <p class="text-xs text-gray-500 mt-1">대본 분석표, 작법서 요약본, 스터디 발제 자료를 공유하고 코멘트를 남깁니다.</p>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-5" id="archive-cards">
        <!-- JS로 렌더링 -->
      </div>
    </section>

  </main>

  <script>
    // 1. 프로젝트 데이터
    const projectsData = [
      { id: 1, member: '세아', title: '여름의 끝자락 (가제)', genre: '청춘 스포츠 멜로 (단막극)', target: 'KBS 단막극 극본공모', progress: 75, docLink: 'https://docs.google.com', currentStage: '트리트먼트 완성 / 초고 집필', feedbacks: ['멤버A', '멤버B'] },
      { id: 2, member: '멤버A', title: '시선의 온도', genre: '미스터리 스릴러 (4부작)', target: 'CJ ENM 오펜', progress: 40, docLink: 'https://docs.google.com', currentStage: '시놉시스 수정 / 인물 빌드업', feedbacks: ['세아'] },
      { id: 3, member: '멤버B', title: '블랙아웃 레코드', genre: '오피스 블랙코미디', target: '방송문화진흥회 공모전', progress: 90, docLink: 'https://docs.google.com', currentStage: '초고 퇴고 및 최종 교정', feedbacks: ['세아', '멤버A'] }
    ];

    // 2. 자료실 데이터
    const archiveData = [
      { id: 1, category: '작품 분석', title: '드라마 <나의 아저씨> 1-4회 씬 구성 및 셋업 분석', author: '세아', date: '2026-10-05', fileLink: 'https://docs.google.com', commentCount: 5, description: '주인공 동훈과 지안의 첫 대면까지의 시퀀스 분할과 복선 회수 방식을 집중 정리했습니다.' },
      { id: 2, category: '이론서 요약', title: '로버트 맥키 <시나리오의 구조> - 제3막 클라이맥스 작법', author: '멤버A', date: '2026-10-02', fileLink: 'https://docs.google.com', commentCount: 3, description: '단막극에 바로 적용해볼 수 있는 전환점(Turning Point) 설계 파트 발췌 요약본입니다.' }
    ];

    let currentSelectedMember = '전체';

    function renderProjects() {
      const tbody = document.getElementById('projects-table-body');
      const filtered = currentSelectedMember === '전체' 
        ? projectsData 
        : projectsData.filter(p => p.member === currentSelectedMember);

      tbody.innerHTML = filtered.map(p => `
        <tr class="hover:bg-gray-50/70 transition-colors">
          <td class="py-4 px-6 font-medium text-gray-900">
            <span class="inline-flex items-center justify-center w-7 h-7 rounded-full bg-[#E8F0EC] text-[#1E3A2F] text-xs font-bold mr-2">
              ${p.member[0]}
            </span>
            ${p.member}
          </td>
          <td class="py-4 px-6">
            <div class="font-semibold text-gray-900">${p.title}</div>
            <div class="text-xs text-gray-400 mt-0.5">${p.genre}</div>
          </td>
          <td class="py-4 px-6 text-xs text-gray-600">
            <span class="bg-gray-100 text-gray-700 px-2.5 py-1 rounded-md font-medium">${p.target}</span>
          </td>
          <td class="py-4 px-6">
            <div class="flex items-center gap-2">
              <div class="flex-1 bg-gray-100 rounded-full h-2 overflow-hidden">
                <div class="bg-[#4A7C59] h-full rounded-full transition-all duration-300" style="width: ${p.progress}%"></div>
              </div>
              <span class="text-xs font-bold text-[#1E3A2F] w-9 text-right">${p.progress}%</span>
            </div>
          </td>
          <td class="py-4 px-6">
            <span class="text-xs text-gray-700 bg-gray-50 border border-gray-200 px-2.5 py-1 rounded-lg">${p.currentStage}</span>
          </td>
          <td class="py-4 px-6">
            <div class="flex items-center gap-1.5 flex-wrap">
              ${p.feedbacks.map(f => `<span class="text-[11px] font-medium bg-[#E8F0EC] text-[#1E3A2F] px-2 py-0.5 rounded-full">@${f}</span>`).join('')}
            </div>
          </td>
          <td class="py-4 px-6 text-center">
            <a href="${p.docLink}" target="_blank" class="inline-flex items-center gap-1 text-xs text-[#4A7C59] font-medium hover:underline bg-[#F2F7F4] px-2.5 py-1.5 rounded-lg border border-[#DDECE2]">
              문서 보기
              <i data-lucide="external-link" class="w-3 h-3"></i>
            </a>
          </td>
        </tr>
      `).join('');
      lucide.createIcons();
    }

    function renderArchives() {
      const container = document.getElementById('archive-cards');
      container.innerHTML = archiveData.map(a => `
        <div class="bg-white p-6 rounded-2xl border border-gray-100 shadow-sm flex flex-col justify-between hover:border-[#CADACF] transition-all">
          <div>
            <div class="flex items-center justify-between mb-3">
              <span class="text-[11px] font-semibold text-[#1E3A2F] bg-[#E8F0EC] px-2.5 py-0.5 rounded-full">${a.category}</span>
              <span class="text-xs text-gray-400">${a.date} · ${a.author}</span>
            </div>
            <h3 class="font-semibold text-gray-900 text-base mb-2 leading-snug">${a.title}</h3>
            <p class="text-xs text-gray-600 leading-relaxed">${a.description}</p>
          </div>
          <div class="mt-6 pt-4 border-t border-gray-100 flex items-center justify-between">
            <a href="${a.fileLink}" target="_blank" class="inline-flex items-center gap-1.5 text-xs text-[#1E3A2F] font-semibold hover:underline">
              <i data-lucide="book-open" class="w-3.5 h-3.5 text-[#4A7C59]"></i> 원문 파일
            </a>
            <span class="text-xs text-gray-500 bg-gray-50 px-2.5 py-1 rounded-lg">💬 의견 (${a.commentCount})</span>
          </div>
        </div>
      `).join('');
      lucide.createIcons();
    }

    function filterMember(member) {
      currentSelectedMember = member;
      document.querySelectorAll('.mem-btn').forEach(btn => {
        if (btn.getAttribute('data-member') === member) {
          btn.className = 'mem-btn px-3 py-1.5 rounded-full text-xs font-medium bg-[#1E3A2F] text-white';
        } else {
          btn.className = 'mem-btn px-3 py-1.5 rounded-full text-xs font-medium bg-gray-100 text-gray-600 hover:bg-gray-200';
        }
      });
      renderProjects();
    }

    function switchTab(tab) {
      const pSec = document.getElementById('section-projects');
      const aSec = document.getElementById('section-archive');
      const pBtn = document.getElementById('btn-tab-projects');
      const aBtn = document.getElementById('btn-tab-archive');

      if (tab === 'projects') {
        pSec.classList.remove('hidden');
        aSec.classList.add('hidden');
        pBtn.className = 'px-4 py-2 rounded-lg text-sm font-medium transition-all bg-[#E8F0EC] text-[#1E3A2F]';
        aBtn.className = 'px-4 py-2 rounded-lg text-sm font-medium transition-all text-gray-500 hover:bg-gray-100';
      } else {
        pSec.classList.add('hidden');
        aSec.classList.remove('hidden');
        aBtn.className = 'px-4 py-2 rounded-lg text-sm font-medium transition-all bg-[#E8F0EC] text-[#1E3A2F]';
        pBtn.className = 'px-4 py-2 rounded-lg text-sm font-medium transition-all text-gray-500 hover:bg-gray-100';
      }
    }

    // 초기 실행
    renderProjects();
    renderArchives();
  </script>
</body>
</html>
